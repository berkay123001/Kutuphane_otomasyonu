<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E130B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Fişlik — kart kataloğundan doğan kütüphane otomasyonu" />
    <title>Fişlik — Kütüphane Otomasyonu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Schibsted+Grotesk:wght@400..800&display=swap"
    />
    <script>
      // Tema, ilk boyamadan önce uygulanır (TemaSaglayici ile aynı kural).
      try {
        var t = localStorage.getItem('fislik-tema')
        var gece = t ? t === 'night' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = gece ? 'gece' : 'gunduz'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="kok"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
